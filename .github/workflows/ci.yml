name: CI and Windows release

# Every push to main (and every version tag v*): run the offline tests, then
# build the Windows release and publish it as a GitHub release, which the
# streaming PC installs via the web UI's UPDATE key or the desktop shortcut.
#
# Release names come from `git describe`: a tagged commit is "v1.3.0", later
# commits are "v1.3.0-2-gabc1234". So every build gets its own name and the
# updater always sees it as new. If a release for the name exists already
# (e.g. main and its tag were pushed together), the build is skipped.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mixer_mute_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline tests
        run: |
          set -e
          for t in tests/*.py; do
            echo "== $t"
            python -m "tests.$(basename "$t" .py)"
          done
      - name: Web UI script syntax
        run: |
          python - <<'EOF'
          s = open("app/static/index.html", encoding="utf-8").read()
          open("/tmp/ui.js", "w", encoding="utf-8").write(s[s.index("<script>") + 8:s.index("</script>")])
          EOF
          node --check /tmp/ui.js
      - name: Desktop agent compiles
        run: python -m py_compile desktop_agent/show_image_agent.py

  windows-release:
    needs: test
    runs-on: windows-latest
    # One release at a time, so main and its tag never build the same name twice.
    concurrency:
      group: windows-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mixer_mute_service
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for git describe
      - name: Release name
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (git describe --tags --match "v*" --always).Trim()
          if ($tag -notmatch '^v') { $tag = "v0.0.0-$tag" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release $tag exists already; nothing to build." }
          else { Write-Host "Building release $tag" }
      - uses: actions/setup-python@v5
        if: steps.name.outputs.exists != 'true'
        with:
          python-version: "3.14"
      - name: Check PowerShell scripts parse
        if: steps.name.outputs.exists != 'true'
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem windows_deployment\*.ps1, desktop_agent\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($f.Name): $_" } }
          }
          if ($failed) { exit 1 }
      - name: Build release
        if: steps.name.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.name.outputs.tag }}
        run: .\windows_deployment\build-release.ps1 -PythonCommand python
      - name: Checksum
        if: steps.name.outputs.exists != 'true'
        run: |
          $zip = "windows_deployment\release\MixerMuteService-Windows-x64.zip"
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() | Set-Content -NoNewline "$zip.sha256"
      - name: Publish GitHub release
        if: steps.name.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.name.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG `
            windows_deployment\release\MixerMuteService-Windows-x64.zip `
            windows_deployment\release\MixerMuteService-Windows-x64.zip.sha256 `
            --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes
