name: CI and Windows release

# Every push: run the offline test suite.
# A tag v* (e.g. v1.2.0): additionally build the Windows release on a Windows
# runner and publish it as a GitHub release, which the streaming PC's updater
# (update-from-github.bat) downloads.
# "Run workflow" (manual): build the Windows release as a downloadable artifact
# without publishing it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mixer_mute_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline tests
        run: |
          set -e
          for t in tests/*.py; do
            echo "== $t"
            python -m "tests.$(basename "$t" .py)"
          done

  windows-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mixer_mute_service
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check PowerShell scripts parse
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem windows_deployment\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($f.Name): $_" } }
          }
          if ($failed) { exit 1 }
      - name: Build release
        run: .\windows_deployment\build-release.ps1 -PythonCommand python
      - name: Checksum
        run: |
          $zip = "windows_deployment\release\MixerMuteService-Windows-x64.zip"
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() | Set-Content -NoNewline "$zip.sha256"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            windows_deployment\release\MixerMuteService-Windows-x64.zip `
            windows_deployment\release\MixerMuteService-Windows-x64.zip.sha256 `
            --title $env:GITHUB_REF_NAME --generate-notes
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MixerMuteService-Windows-x64
          path: mixer_mute_service/windows_deployment/release/MixerMuteService-Windows-x64.zip
